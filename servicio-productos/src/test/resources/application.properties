# Las pruebas usan H2 en memoria (modo PostgreSQL) y no requieren PostgreSQL ni Eureka.
# persistence-routing se activa con la URL del primario; sin réplicas, todo va al primario.
# Este archivo se suma a application.yml y tiene prioridad sobre él.
persistence.routing.primary.url=jdbc:h2:mem:productos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
persistence.routing.primary.username=sa
persistence.routing.primary.password=
eureka.client.enabled=false
instance.id=test-1
