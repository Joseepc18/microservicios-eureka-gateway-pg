# Las pruebas usan H2 en memoria (modo PostgreSQL) y no requieren PostgreSQL ni Eureka.
# Este archivo se suma a application.yml y tiene prioridad sobre él.
spring.datasource.url=jdbc:h2:mem:pedidos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
eureka.client.enabled=false
instance.id=test-1
