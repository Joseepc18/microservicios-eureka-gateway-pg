spring:
  application:
    name: servicio-pedidos
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo lo valida.
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    loadbalancer:
      cache:
        # Caché de instancias del LoadBalancer (por defecto 35 s).
        ttl: 5s
      # Reintento en las llamadas a servicio-productos (requiere spring-retry, ver pom.xml).
      # Mientras Eureka no expulsa una instancia caída, el LoadBalancer puede elegirla: un GET que
      # falla por conexión o timeout se repite una vez en OTRA instancia. Solo GET: un PATCH de
      # stock repetido podría descontar dos veces (retry-on-all-operations = false).
      retry:
        enabled: true
        retry-on-all-operations: false
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1

# Enrutamiento de persistencia (módulo persistence-routing): escrituras al primario y lecturas
# readOnly repartidas entre las réplicas. Las réplicas se declaran por variables de entorno
# (PERSISTENCE_ROUTING_REPLICAS_n_URL, ver docker-compose.yml); sin réplicas, todo va al primario.
persistence:
  routing:
    primary:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos_db}
      username: ${DB_USER:pedidos_app}
      password: ${DB_PASSWORD:}

server:
  port: ${SERVER_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Consulta el registro cada 5 s (por defecto 30 s).
    registry-fetch-interval-seconds: 5
  instance:
    instance-id: ${spring.application.name}:${INSTANCE_ID:${random.value}}
    # Latido cada 5 s y expiración a los 10 s (por defecto 30 s y 90 s).
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# Identifica a la instancia que respondió (header X-Instance-Id).
instance:
  id: ${INSTANCE_ID:local}

# Llamadas a servicio-productos (por nombre lógico de Eureka, ver ClienteProductosConfig).
productos:
  client:
    connect-timeout: 2s
    read-timeout: 5s

# El identificador de correlación (X-Request-Id) aparece en cada línea de log.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
