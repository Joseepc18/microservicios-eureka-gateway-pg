spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  client:
    # Eureka Server único: no se registra a sí mismo ni consulta el registro.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Tiempos ajustados para que la caída de una instancia sea observable en la demo
    # (valores por defecto: evicción cada 60 s, expiración a los 90 s).
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 3000
    # La autopreservación suspende la expulsión de instancias cuando las renovaciones caen
    # por debajo de un umbral (por ejemplo, si cae un grupo grande de instancias a la vez).
    # Se desactiva solo en este laboratorio para que el registro nunca conserve instancias
    # muertas durante las demos; en producción se mantendría activada. Con una sola
    # instancia caída la expulsión ocurre igualmente a los ~24 s (comprobado).
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
