spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  client:
    # Eureka Server único: no se registra a sí mismo ni consulta el registro.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Tiempos ajustados para que la caída de una instancia sea observable en la demo
    # (valores por defecto: evicción cada 60 s, expiración a los 90 s).
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 3000
    # Con la autopreservación activa Eureka deja de expulsar instancias caídas cuando
    # detecta pocas renovaciones, algo habitual con 2-3 instancias. Se desactiva solo
    # en este laboratorio; en producción se mantendría activada.
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
